<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Kasir Front House</title>
<style>
:root{
  --primary:#0F766E; --primary-dark:#0b5c56; --primary-light:#14b8a6;
  --ewallet:#10b981; --bank:#3b82f6; --cash:#f59e0b; --voucher:#8b5cf6;
  --barang:#64748b; --ppob:#06b6d4; --mutasi:#6366f1;
  --danger:#ef4444; --warning:#f59e0b; --success:#10b981;
  --bg:#f1f5f9; --card:#ffffff; --text:#0f172a; --muted:#64748b; --border:#e2e8f0;
  --fs-mult:1;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  overscroll-behavior:contain; overflow:hidden;}
#app-root{position:fixed; inset:0; display:flex; flex-direction:column; padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom);}
#screen{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:14px 14px 90px 14px;}
#screen.slide{animation:slideIn .22s ease-out;}
@keyframes slideIn{from{opacity:0; transform:translateX(16px);} to{opacity:1; transform:translateX(0);}}

/* Top bar */
.topbar{display:flex; align-items:center; gap:10px; padding:12px 14px; background:linear-gradient(135deg,var(--primary),var(--primary-light));
  color:#fff; box-shadow:0 2px 8px rgba(15,118,110,.25); position:relative; z-index:5;}
.topbar h1{font-size:calc(16px * var(--fs-mult)); margin:0; font-weight:700; flex:1;}
.back-btn{background:rgba(255,255,255,.18); border:none; color:#fff; width:34px; height:34px; border-radius:10px;
  font-size:calc(18px * var(--fs-mult)); display:flex; align-items:center; justify-content:center;}
.kasir-chip{font-size:calc(11px * var(--fs-mult)); background:rgba(255,255,255,.18); padding:5px 10px; border-radius:20px; white-space:nowrap;}
.lock-btn{background:rgba(255,255,255,.18); border:none; color:#fff; width:32px; height:32px; border-radius:10px; font-size:calc(15px * var(--fs-mult));}

/* Bottom nav */
.bottomnav{position:fixed; left:0; right:0; bottom:0; display:flex; background:var(--card);
  box-shadow:0 -2px 12px rgba(0,0,0,.08); padding-bottom:env(safe-area-inset-bottom); z-index:10;}
.navbtn{flex:1; border:none; background:none; padding:9px 2px 8px; display:flex; flex-direction:column;
  align-items:center; gap:2px; color:var(--muted); font-size:calc(10.5px * var(--fs-mult)); font-weight:600;}
.navbtn.active{color:var(--primary);}
.navbtn .ic{font-size:calc(19px * var(--fs-mult));}

/* Cards */
.card{background:var(--card); border-radius:16px; padding:16px; margin-bottom:12px; box-shadow:0 1px 3px rgba(0,0,0,.06);}
.card-hero{background:linear-gradient(135deg,var(--primary),var(--primary-light)); color:#fff; border-radius:18px;
  padding:18px; margin-bottom:12px; box-shadow:0 6px 16px rgba(15,118,110,.25);}
.card-hero .lbl{font-size:calc(12px * var(--fs-mult)); opacity:.85; font-weight:600;}
.card-hero .val{font-size:calc(28px * var(--fs-mult)); font-weight:800; margin-top:4px;}
.card-sub{background:var(--card); border-radius:14px; padding:12px 14px; margin-bottom:12px; border:1px solid var(--border);}
.card-sub .lbl{font-size:calc(11px * var(--fs-mult)); color:var(--muted); font-weight:600;}
.card-sub .val{font-size:calc(18px * var(--fs-mult)); font-weight:700; margin-top:2px;}

.grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px;}

.section-title{font-size:calc(13px * var(--fs-mult)); font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.03em;
  margin:14px 0 8px 2px;}

.acc-card{border-radius:14px; padding:12px; color:#fff; position:relative; overflow:hidden; margin-bottom:8px;
  box-shadow:0 3px 8px rgba(0,0,0,.12);}
.acc-card .name{font-size:calc(13px * var(--fs-mult)); font-weight:700;}
.acc-card .tipe{font-size:calc(10px * var(--fs-mult)); opacity:.85;}
.acc-card .saldo{font-size:calc(17px * var(--fs-mult)); font-weight:800; margin-top:6px;}
.acc-card.low::after{content:"⚠ di bawah ambang"; position:absolute; top:8px; right:10px; font-size:calc(9px * var(--fs-mult));
  background:rgba(0,0,0,.25); padding:2px 6px; border-radius:8px;}

.badge{display:inline-block; padding:3px 9px; border-radius:20px; font-size:calc(10.5px * var(--fs-mult)); font-weight:700;}
.badge-in{background:#d1fae5; color:#065f46;}
.badge-out{background:#fee2e2; color:#991b1b;}
.badge-netral{background:#e2e8f0; color:#334155;}
.badge-mutasi{background:#e0e7ff; color:#3730a3;}
.badge-unpaid{background:#fef3c7; color:#92400e;}
.badge-locked{background:#e2e8f0; color:#475569;}

.alert-strip{display:flex; gap:8px; overflow-x:auto; margin-bottom:6px; padding-bottom:4px;}
.alert-chip{flex:0 0 auto; background:#fff7ed; border:1px solid #fed7aa; color:#9a3412; font-size:calc(11.5px * var(--fs-mult));
  font-weight:600; padding:8px 12px; border-radius:12px; white-space:nowrap;}
.alert-chip.danger{background:#fef2f2; border-color:#fecaca; color:#991b1b;}

.shortcuts{display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin-bottom:6px;}
.shortcut{display:flex; flex-direction:column; align-items:center; gap:5px; padding:10px 2px; border-radius:14px;
  color:#fff; font-size:calc(10px * var(--fs-mult)); font-weight:700; text-align:center;}
.shortcut .ic{font-size:calc(20px * var(--fs-mult));}

/* Buttons */
.btn{display:block; width:100%; padding:13px; border:none; border-radius:12px; font-size:calc(15px * var(--fs-mult)); font-weight:700;
  color:#fff; background:var(--primary); position:relative; overflow:hidden;}
.btn:active{transform:scale(.98);}
.btn-outline{background:#fff; color:var(--primary); border:1.5px solid var(--primary);}
.btn-danger{background:var(--danger);}
.btn-sm{padding:8px 12px; font-size:calc(12.5px * var(--fs-mult)); border-radius:9px; width:auto; display:inline-block;}
.btn-row{display:flex; gap:8px;}
.btn-row .btn{flex:1;}

/* Forms */
label.f{display:block; font-size:calc(12px * var(--fs-mult)); font-weight:700; color:var(--muted); margin:12px 0 6px;}
input[type=text],input[type=date],input[type=number],select,textarea{
  width:100%; padding:11px 12px; border:1.5px solid var(--border); border-radius:11px; font-size:calc(14.5px * var(--fs-mult));
  background:#fff; color:var(--text);}
textarea{resize:vertical; min-height:56px;}
.seg{display:flex; flex-wrap:wrap; gap:7px;}
.seg-btn{padding:9px 13px; border-radius:11px; border:1.5px solid var(--border); background:#fff; font-size:calc(13px * var(--fs-mult));
  font-weight:600; color:var(--text);}
.seg-btn.sel{color:#fff; border-color:transparent; background:var(--primary);}
.hint{font-size:calc(11.5px * var(--fs-mult)); color:var(--muted); margin-top:4px;}

/* Keypad */
.amount-display{background:#0f172a; color:#fff; border-radius:14px; padding:16px; text-align:right; font-size:calc(26px * var(--fs-mult));
  font-weight:800; margin-bottom:10px; letter-spacing:.02em;}
.keypad{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:14px;}
.key{padding:15px 0; text-align:center; font-size:calc(19px * var(--fs-mult)); font-weight:700; background:#fff; border:1px solid var(--border);
  border-radius:12px;}
.key:active{background:#f1f5f9;}
.key.fn{background:#fef2f2; color:var(--danger); font-size:calc(15px * var(--fs-mult));}

/* Rows */
.row-item{display:flex; align-items:center; gap:10px; padding:11px 0; border-bottom:1px solid var(--border);}
.row-item:last-child{border-bottom:none;}
.row-dot{width:9px; height:9px; border-radius:50%; flex:0 0 auto;}
.row-main{flex:1; min-width:0;}
.row-title{font-size:calc(13.5px * var(--fs-mult)); font-weight:700;}
.row-sub{font-size:calc(11.5px * var(--fs-mult)); color:var(--muted); margin-top:1px;}
.row-amt{font-size:calc(14px * var(--fs-mult)); font-weight:800; white-space:nowrap;}

.tabs{display:flex; gap:6px; margin-bottom:12px; background:#e2e8f0; padding:4px; border-radius:12px;}
.tab{flex:1; text-align:center; padding:8px 4px; border-radius:9px; font-size:calc(12px * var(--fs-mult)); font-weight:700; color:var(--muted);}
.tab.sel{background:#fff; color:var(--primary);}

.settings-list a.setting-item{display:flex; align-items:center; gap:12px; padding:13px 4px; border-bottom:1px solid var(--border);
  text-decoration:none; color:var(--text); font-size:calc(14px * var(--fs-mult)); font-weight:600; cursor:pointer;}
.settings-list .ic{font-size:calc(19px * var(--fs-mult)); width:26px; text-align:center;}

/* Toast */
#toast{position:fixed; left:50%; bottom:92px; transform:translateX(-50%) translateY(20px); background:#0f172a; color:#fff;
  padding:11px 18px; border-radius:12px; font-size:calc(13px * var(--fs-mult)); font-weight:600; opacity:0; pointer-events:none; z-index:100;
  transition:all .25s ease; max-width:88%; text-align:center; box-shadow:0 6px 20px rgba(0,0,0,.25);}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

/* Lock screen */
#lockscreen{position:fixed; inset:0; background:linear-gradient(160deg,var(--primary-dark),var(--primary)); z-index:200;
  display:flex; flex-direction:column; color:#fff; padding:env(safe-area-inset-top) 20px env(safe-area-inset-bottom);}
.lock-inner{flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; padding:20px 0;}
.lock-logo{font-size:calc(44px * var(--fs-mult)); margin-bottom:6px;}
.lock-title{font-size:calc(19px * var(--fs-mult)); font-weight:800; margin-bottom:2px;}
.lock-sub{font-size:calc(12.5px * var(--fs-mult)); opacity:.8; margin-bottom:22px;}
.kasir-tiles{display:flex; flex-wrap:wrap; gap:12px; justify-content:center;}
.kasir-tile{width:84px; display:flex; flex-direction:column; align-items:center; gap:6px; color:#fff; background:rgba(255,255,255,.12);
  padding:12px 6px; border-radius:14px; border:none;}
.kasir-avatar{width:44px; height:44px; border-radius:50%; background:rgba(255,255,255,.25); display:flex; align-items:center;
  justify-content:center; font-weight:800; font-size:calc(17px * var(--fs-mult));}
.pin-dots{display:flex; gap:12px; margin:18px 0;}
.pin-dot{width:14px; height:14px; border-radius:50%; border:2px solid rgba(255,255,255,.6);}
.pin-dot.filled{background:#fff;}
.pin-keypad{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; width:240px;}
.pin-key{padding:16px 0; text-align:center; font-size:calc(20px * var(--fs-mult)); font-weight:700; background:rgba(255,255,255,.12); border:none;
  border-radius:50%; color:#fff; width:64px; height:64px; justify-self:center;}
.pin-key:active{background:rgba(255,255,255,.28);}
.linklike{color:#fff; text-decoration:underline; font-size:calc(12.5px * var(--fs-mult)); opacity:.85; background:none; border:none; margin-top:14px;}

.empty-state{text-align:center; padding:40px 10px; color:var(--muted);}
.empty-state .ic{font-size:calc(38px * var(--fs-mult)); margin-bottom:8px;}

.ripple{position:relative;}
</style>

<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<body>
<div id="app-root">
  <div id="topbar" class="topbar"></div>
  <div id="screen"></div>
  <div id="bottomnav" class="bottomnav"></div>
</div>
<div id="toast"></div>
<div id="lockscreen" style="display:none;"></div>

<script>
/* =====================================================================
   KASIR FRONT HOUSE — Android Web App (single-file, offline-first)
   Basis: Blueprint Sistem Kasir v3
   Penyimpanan: localStorage (menggantikan SQLite native untuk versi web).
   ponytail: 1 file, 1 key storage, tanpa build step, tanpa dependency luar.
   ===================================================================== */

const STORE_KEY = 'kasirAppDataV1';
const ACC_COLOR = {ewallet:'var(--ewallet)', bank:'var(--bank)', cash:'var(--cash)',
  voucher:'var(--voucher)', barang:'var(--barang)', ppob_server:'var(--ppob)'};
const ACC_LABEL = {ewallet:'E-Wallet', bank:'Bank', cash:'Cash', voucher:'Voucher',
  barang:'Barang', ppob_server:'PPOB Server'};

let DB = null;

function nowIso(){ return new Date().toISOString(); }
// ponytail: pakai locale 'en-CA' -> format YYYY-MM-DD tapi dari tanggal KALENDER LOKAL
// perangkat, bukan UTC (beda dengan toISOString() yang selalu UTC). Ini akar masalah
// bug "tanggal baru tidak bisa input setelah tutup kasir": untuk WIB (UTC+7), jam
// 00:00-06:59 WIB itu masih tanggal kemarin kalau dihitung UTC, jadi kena kunci
// closing.tanggal kemarin padahal buat pengguna sudah hari baru.
function todayStr(){ return new Date().toLocaleDateString('en-CA'); }
function uid(table){ const id = DB.nextId[table]++; return id; }
function fmtRp(n){ n = Math.round(Number(n)||0); const neg = n<0; n=Math.abs(n);
  return (neg?'-':'')+'Rp '+n.toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.'); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg, type){
  const t = document.getElementById('toast');
  t.textContent = (type==='error'?'⚠ ':type==='ok'?'✓ ':'') + msg;
  t.style.background = type==='error' ? '#991b1b' : type==='ok' ? '#065f46' : '#0f172a';
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>t.classList.remove('show'), 2400);
}

function seedIfEmpty(){
  const acc = (name, tipe) => { const id = uid('accounts'); DB.accounts.push({id, name, tipe, saldo_awal:0, ambang_minimum:0, aktif:1}); return id; };
  // cat: setiap kategori WAJIB nentuin flow & is_penjualan sendiri — tidak ada default
  // diam-diam, ini akar bug lama (semua kategori ke-hardcode 'Pemasukan').
  // is_penjualan: true = dihitung di "Volume Transaksi" (jasa/produk yang dijual ke
  // customer dengan margin); false = mutasi/administratif (setor modal, ambil pribadi,
  // belanja stok) yang TIDAK dianggap penjualan walau tetap mempengaruhi saldo.
  const cat = (name, account_ids, flow, is_penjualan, arah) => {
    DB.categories.push({id:uid('categories'), name, flow, is_penjualan: !!is_penjualan, arah, account_ids});
  };
  const jasaKeluar = (names, accIds) => names.forEach(n=>cat(n, accIds, 'Pengeluaran', true));   // Setor/Transfer: saldo saya keluar, tapi tetap penjualan/jasa
  const jasaMasuk  = (names, accIds) => names.forEach(n=>cat(n, accIds, 'Pemasukan', true));      // Tarik: saldo saya nambah, tetap penjualan/jasa
  const produkPPOB = (names, accIds) => names.forEach(n=>cat(n, accIds, 'Pengeluaran', true));    // stok/saldo terpakai, profit dicatat di field profit
  const lainnyaAdmin = (accIds) => cat('Lainnya', accIds, 'Pengeluaran', false);                   // catch-all, konservatif: tidak dihitung penjualan

  const dana = [1,2,3,4].map(n=>acc('DANA '+n, 'ewallet'));
  const seaBank = acc('Sea Bank', 'bank');
  const shopeepay = acc('Shopeepay', 'ewallet');
  const saveplus = acc('Saveplus', 'ppob_server');
  const fastpay = acc('Fastpay', 'ppob_server');
  const mandiri = acc('Mandiri', 'bank');
  const cash = acc('Cash', 'cash');
  const voucherFisik = acc('Voucher Fisik', 'voucher');
  const barang = acc('Barang', 'barang');

  // DANA 1-4 (satu kategori dipakai bareng utk ke-4 akun, sama seperti versi asli)
  // & Sea Bank (kategori sendiri): pola sama — Tarik masuk, Setor/Transfer keluar tapi tetap jasa
  [dana, [seaBank]].forEach(accIds=>{
    jasaMasuk(['Tarik'], accIds);
    jasaKeluar(['TopUp','Transfer'], accIds);
    lainnyaAdmin(accIds);
  });

  // Shopeepay: Transfer = jasa keluar; Listrik/BRI VA/Gopay = produk PPOB
  jasaKeluar(['Transfer'], [shopeepay]);
  produkPPOB(['Listrik','BRI VA','Gopay'], [shopeepay]);
  lainnyaAdmin([shopeepay]);

  // Saveplus & Fastpay: semua produk PPOB (paket data/pulsa/EDC/topup)
  produkPPOB(['Paket Data','Pulsa'], [saveplus]);
  lainnyaAdmin([saveplus]);
  produkPPOB(['EDC','Topup','Paket Data','Pulsa'], [fastpay]);
  lainnyaAdmin([fastpay]);

  // Mandiri: sama pola dana (Tarik Tunai masuk, Setor/Transfer keluar tapi jasa)
  jasaMasuk(['Tarik Tunai'], [mandiri]);
  jasaKeluar(['Transfer','TopUp'], [mandiri]);
  lainnyaAdmin([mandiri]);

  // Cash: SPESIAL — ini uang tunai fisik di laci, arahnya kebalikan dari e-wallet.
  // Setor = uang tunai MASUK ke laci (dari closing/pemilik/tukar saldo customer).
  // Tarik = uang tunai KELUAR dari laci (dikasih ke customer yang tarik saldo).
  // Bukan "penjualan" — cuma mutasi kas, jadi is_penjualan:false.
  cat('Topup', [cash], 'Pemasukan', false);
  cat('Tarik', [cash], 'Pengeluaran', false);

  // Voucher Fisik & Barang: barang dagangan fisik terjual → stok/saldo keluar, tapi penjualan
  produkPPOB(['Paket Data & Perdana','Telkomsel','Tri','Indosat','Axis','Smartfren','XL'], [voucherFisik]);
  produkPPOB(['Kabel','Charger','Mainan','Tempered Glass','Casing','Lainnya'], [barang]);

  // kategori umum, berlaku lintas akun (account_ids null = global) — flow ini
  // sudah benar dari awal, cuma ditambah is_penjualan:false (bukan penjualan)
  DB.categories.push(
    {id:uid('categories'), name:'Belanja Stok', flow:'Pengeluaran', is_penjualan:false, account_ids:null},
    {id:uid('categories'), name:'Biaya Operasional', flow:'Pengeluaran', is_penjualan:false, account_ids:null},
    {id:uid('categories'), name:'Setoran Pemilik', flow:'Netral', arah:'+', is_penjualan:false, account_ids:null},
    {id:uid('categories'), name:'Ambil Pribadi (Prive)', flow:'Netral', arah:'-', is_penjualan:false, account_ids:null}
  );

  DB.kasir.push({id:uid('kasir'), nama:'Admin', pin_hash:null, pin_salt:null, aktif:1});
}

function normalizeDB(){
  if(!DB.closings) DB.closings=[];
  if(!DB.nextId.closings) DB.nextId.closings=1;
  DB.categories.forEach(c=>{ if(c.aktif===undefined) c.aktif=1; });
  if(!DB.settings) DB.settings = {fontScale:'regular'};
  if(!DB.settings.fontScale) DB.settings.fontScale = 'regular';
  applyFontScale();
  const migrated = migrateFlowFixV2();
  if(migrated){
    saveDB();
    alert('Update penting: arah saldo kategori (Topup/Tarik/Transfer/dll) yang salah dari awal sudah dibetulkan otomatis, termasuk transaksi lama. Saldo & laporan yang tampil sekarang mungkin berbeda dari sebelumnya — itu memang angka yang benar. Cek Kelola Kategori kalau ada yang perlu disesuaikan lagi.');
  }
  if(migrateTopupRename()) saveDB();
  if(migrateExpenseTypeFix()) saveDB();
  if(migrateStockMutasiExpenseTypeFix()) saveDB();
}
function loadDB(){
  const raw = localStorage.getItem(STORE_KEY);
  if(raw){ try{ DB = JSON.parse(raw); }catch(e){ DB = null; } }
  if(!DB){
    DB = {accounts:[], categories:[], transactions:[], kasbon:[], kasir:[], closings:[],
      nextId:{accounts:1,categories:1,transactions:1,kasbon:1,kasir:1,closings:1}, currentKasirId:null,
      migratedFlowV2:true};
    seedIfEmpty();
    saveDB();
  }
  normalizeDB();
}
function saveDB(){ localStorage.setItem(STORE_KEY, JSON.stringify(DB)); }

/* ---------- migrasi satu-kali: perbaikan arah saldo (flow) kategori & transaksi lama ----------
   Bug lama: SEMUA kategori bawaan ke-hardcode flow:'Pemasukan' (lihat riwayat seedIfEmpty),
   jadi setiap transaksi apapun selalu MENAMBAH saldo, tidak pernah mengurangi. Fungsi ini
   membetulkan kategori yang belum pernah dibetulkan (ditandai is_penjualan===undefined),
   LALU menerapkan ulang flow yang benar itu ke transaksi lama yang sudah tercatat pakai
   kategori tsb (supaya saldo historis ikut kebetulan, bukan cuma transaksi baru).
   Kategori custom yang sudah dibuat manual oleh user tidak disentuh (sudah pasti sudah
   punya is_penjualan begitu ditambahkan lewat form, lihat addKategori). */
function correctFlowFor(catName, accIds){
  if(!accIds || !accIds.length) return null; // kategori global (Belanja Stok dkk) — flow-nya sudah benar dari awal
  const acc = getAccount(accIds[0]);
  if(!acc) return null;
  if(acc.tipe==='cash'){
    if(catName==='TopUp') return {flow:'Pemasukan', is_penjualan:false};
    if(catName==='Tarik') return {flow:'Pengeluaran', is_penjualan:false};
    return null;
  }
  if(catName==='Tarik' || catName==='Tarik Tunai') return {flow:'Pemasukan', is_penjualan:true};
  if(catName==='TopUp' || catName==='Transfer') return {flow:'Pengeluaran', is_penjualan:true};
  if(catName==='Lainnya'){
    const tetapPenjualan = acc.tipe==='barang' || acc.tipe==='voucher';
    return {flow:'Pengeluaran', is_penjualan: tetapPenjualan};
  }
  return {flow:'Pengeluaran', is_penjualan:true}; // produk PPOB / barang / voucher fisik
}
function migrateFlowFixV2(){
  if(DB.migratedFlowV2) return false;
  let changed = false;
  const fixedCatIds = new Set();
  DB.categories.forEach(c=>{
    if(c.is_penjualan!==undefined) return; // sudah pernah dibetulkan / kategori custom user
    if(!c.account_ids){ c.is_penjualan = false; changed = true; return; } // global, flow sudah benar
    const fix = correctFlowFor(c.name, c.account_ids);
    if(!fix) return;
    c.flow = fix.flow; c.is_penjualan = fix.is_penjualan;
    fixedCatIds.add(c.id); changed = true;
  });
  if(fixedCatIds.size){
    DB.transactions.forEach(t=>{
      if(t.kategori_id==null || !fixedCatIds.has(t.kategori_id)) return;
      const cat = getCategory(t.kategori_id);
      t.flow = cat.flow; t.is_penjualan = cat.is_penjualan;
      changed = true;
    });
  }
  DB.migratedFlowV2 = true;
  return changed;
}

/* ---------- migrasi satu-kali: rename kategori 'TopUp/Setor' -> 'Topup' ----------
   Supaya instalasi lama yang localStorage-nya masih punya nama kategori lama tetap
   ikut ter-update (kategori dan histori transaksi yang sudah kepakai nama itu),
   bukan cuma instalasi baru dari seedIfEmpty(). */
function migrateTopupRename(){
  if(DB.migratedTopupRename) return false;
  let changed = false;
  DB.categories.forEach(c=>{ if(c.name==='TopUp/Setor'){ c.name='Topup'; changed=true; } });
  DB.transactions.forEach(t=>{ if(t.kategori==='TopUp/Setor'){ t.kategori='Topup'; changed=true; } });
  DB.migratedTopupRename = true;
  return changed;
}

/* ---------- migrasi satu-kali: bersihkan expense_type yang salah nempel ----------
   Sebelum fix ini, semua transaksi flow='Pengeluaran' (termasuk transaksi JUALAN kayak
   Topup e-wallet, produk PPOB, dll — yang saldo-nya keluar tapi tetap penjualan) ikut
   ke-tag expense_type COGS/OPEX, jadi salah kehitung sebagai biaya di Laba Rugi. Migrasi
   ini menghapus expense_type dari transaksi yang is_penjualan=true (bukan biaya asli). */
function migrateExpenseTypeFix(){
  if(DB.migratedExpenseTypeFix) return false;
  let changed = false;
  DB.transactions.forEach(t=>{
    if(t.is_penjualan && t.expense_type){ t.expense_type = null; changed = true; }
  });
  DB.migratedExpenseTypeFix = true;
  return changed;
}

/* ---------- migrasi satu-kali: hapus expense_type dari transaksi Belanja Stok (Mutasi) ----------
   Fix sebelumnya bikin Belanja Stok jadi flow='Mutasi' (uang -> nilai stok, benar), tapi masih
   nempel expense_type='COGS' di transaksi itu — jadi Laba Rugi motong modal DUA KALI: sekali di
   margin/profit tiap penjualan dari stok itu, sekali lagi di sini. Transaksi Mutasi bukan expense
   P&L, jadi expense_type-nya harus null. */
function migrateStockMutasiExpenseTypeFix(){
  if(DB.migratedStockMutasiExpenseTypeFix) return false;
  let changed = false;
  DB.transactions.forEach(t=>{
    if(t.flow==='Mutasi' && t.expense_type){ t.expense_type = null; changed = true; }
  });
  DB.migratedStockMutasiExpenseTypeFix = true;
  return changed;
}

/* ---------- getters ---------- */
function getAccount(id){ return DB.accounts.find(a=>a.id===id); }
function getCategory(id){ return DB.categories.find(c=>c.id===id); }
function getKasir(id){ return DB.kasir.find(k=>k.id===id); }
function activeAccounts(){ return DB.accounts.filter(a=>a.aktif); }
/* akun yang merepresentasikan NILAI STOK fisik (Barang/Voucher Fisik) — dipakai Belanja
   Stok buat nentuin akun mana yang nilainya harus nambah pas restock (lihat submitTransaksi). */
function stockAccounts(){ return DB.accounts.filter(a=>a.aktif && (a.tipe==='barang'||a.tipe==='voucher')); }

/* strategi saldo bertingkat: checkpoint tutup-kasir terakhir + transaksi setelahnya */
function getLatestClosing(accountId){
  const list = DB.closings.filter(c=>c.account_id===accountId).sort((a,b)=>b.tanggal.localeCompare(a.tanggal));
  return list[0] || null;
}
/* closing terakhir yg <= tanggal yg diminta — beda dari getLatestClosing() yang selalu
   ambil closing paling baru walau tanggalnya di MASA DEPAN dari `tanggal` yg diminta.
   Dipakai tiap kali butuh saldo/breakdown "per posisi tanggal X", bukan "per hari ini". */
function getClosingAsOf(accountId, tanggal){
  return DB.closings.filter(c=>c.account_id===accountId && c.tanggal<=tanggal)
    .sort((a,b)=>b.tanggal.localeCompare(a.tanggal))[0] || null;
}
function getSaldo(accountId){ return getSaldoAsOf(accountId, todayStr()); }
/* saldo per posisi akhir tanggal tertentu (dipakai Tutup Kasir susulan agar transaksi
   SETELAH tanggal yang ditutup tidak ikut kehitung/kekunci) */
function getSaldoAsOf(accountId, tanggal){
  const acc = getAccount(accountId); if(!acc) return 0;
  const closing = getClosingAsOf(accountId, tanggal);
  let base = closing ? closing.saldo_fisik : acc.saldo_awal;
  const afterDate = closing ? closing.tanggal : null;
  let total = base;
  for(const tx of DB.transactions){
    if(afterDate && tx.tanggal <= afterDate) continue;
    if(tx.tanggal > tanggal) continue; // exclude transaksi setelah tanggal yang dihitung
    if(tx.payment_status === 'unpaid') continue; // kasbon: belum masuk kas riil
    if(tx.account_id===accountId){
      if(tx.flow==='Pemasukan') total += tx.amount;
      else if(tx.flow==='Pengeluaran') total -= tx.amount;
      else if(tx.flow==='Netral') total += (tx.netral_arah==='-'? -tx.amount : tx.amount);
      else if(tx.flow==='Mutasi') total -= tx.amount; // sebagai akun asal
    }
    if(tx.target_account_id===accountId && tx.flow==='Mutasi'){
      total += tx.amount; // sebagai akun tujuan
    }
  }
  return total;
}
function addDays(dateStr, n){
  const d = new Date(dateStr+'T00:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10);
}
/* tanggal default yang harus ditutup untuk akun ini: hari tertua yang masih belum
   dikunci sejak closing terakhir (memaksa penutupan berurutan, tidak boleh loncat) */
function defaultClosingDate(accountId){
  const closing = getLatestClosing(accountId);
  const dates = DB.transactions
    .filter(t=>!t.locked && (t.account_id===accountId || t.target_account_id===accountId))
    .map(t=>t.tanggal)
    .filter(d=> !closing || d>closing.tanggal)
    .sort();
  return dates[0] || todayStr();
}

/* ---------- audit ---------- */
function runAudit(tx){
  const reasons = [];
  const twoMinAgo = Date.now() - 2*60*1000;
  const dup = DB.transactions.find(t => t.id!==tx.id && t.account_id===tx.account_id && t.amount===tx.amount &&
    t.kategori_id===tx.kategori_id && new Date(t.created_at).getTime() >= twoMinAgo);
  if(dup) reasons.push('Kemungkinan duplikat entri (akun, kategori, nominal sama dalam 2 menit terakhir)');

  const sejenis = DB.transactions.filter(t=>t.kategori_id===tx.kategori_id && t.id!==tx.id).slice(-20);
  if(sejenis.length >= 5){
    const avg = sejenis.reduce((s,t)=>s+t.amount,0)/sejenis.length;
    if(avg>0 && tx.amount > avg*3) reasons.push('Nominal jauh di atas rata-rata transaksi kategori ini (>3x rata-rata)');
  }
  tx.flag_suspect = reasons.length ? 1 : 0;
  tx.suspect_reasons = reasons.join('; ');
}

/* ---------- PIN hashing ----------
   crypto.subtle butuh secure context (https/localhost). Jika file dibuka
   langsung dari disk (file://) atau WebView non-https, fallback ke hash
   sederhana — cukup untuk PIN lokal 4-6 digit (bukan pengganti auth server). */
async function sha256(text){
  if(window.crypto && window.crypto.subtle){
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }
  return simpleHash(text);
}
function simpleHash(text){
  // ponytail: FNV-1a 32-bit, fallback saja saat Web Crypto tak tersedia
  let h = 0x811c9dc5;
  for(let i=0;i<text.length;i++){ h ^= text.charCodeAt(i); h = Math.imul(h, 0x01000193); }
  return (h>>>0).toString(16).padStart(8,'0');
}
function randomSalt(){ return Math.random().toString(36).slice(2)+Date.now().toString(36); }

let dashRangeStart = null, dashRangeEnd = null, dashRangePreset = 'today';
function setDashRange(preset){
  const today = todayStr();
  dashRangePreset = preset;
  if(preset==='today'){ dashRangeStart=today; dashRangeEnd=today; }
  else if(preset==='week'){
    const d = new Date(today+'T00:00:00Z');
    const diffToMonday = (d.getUTCDay()===0? 6 : d.getUTCDay()-1);
    dashRangeStart = addDays(today, -diffToMonday); dashRangeEnd = today;
  } else if(preset==='month'){ dashRangeStart = today.slice(0,7)+'-01'; dashRangeEnd = today; }
  document.getElementById('screen').innerHTML = screenDashboard();
}

  const today = todayStr();
  if(!dashRangeStart) dashRangeStart = today;
  if(!dashRangeEnd) dashRangeEnd = today;
  let pendapatanRiil=0, volume=0;
  for(const t of DB.transactions){
    if(t.tanggal < dashRangeStart || t.tanggal > dashRangeEnd) continue;
    if(t.is_penjualan && t.payment_status==='paid') pendapatanRiil += (t.profit||0);
    if(t.is_penjualan) volume += t.amount;

  const rangeLabel = dashRangeStart===dashRangeEnd ? esc(dashRangeStart) : `${esc(dashRangeStart)} s/d ${esc(dashRangeEnd)}`;

    if(s < a.ambang_minimum) alerts.push({txt:`${a.name} di bawah ambang (${fmtRp(s)})`, danger:true});

  if(kasbonJatuhTempo.length) alerts.push({txt:`${kasbonJatuhTempo.length} kasbon jatuh tempo (>7 hari)`, danger:true});
  const lastAudit = DB.transactions.filter(t=>t.flag_suspect).length;

/* ---------------- MIRROR CASH (otomatis dari transaksi Penjualan) ----------------
   Kenapa account_id/target_account_id salah satu sengaja null: akun sumber transaksi
   asli (DANA/Shopeepay/dst) SUDAH kepotong/nambah lewat transaksi aslinya sendiri —
   kalau mirror ini ikut nyantol ke akun sumber juga, saldo akun itu keitung 2x.
   Mirror ini cuma nyentuh Cash, seolah uang fisik itu "muncul dari luar sistem"
   (dari kantong customer) — itu memang yang beneran kejadian.
   Tarik/Tarik Tunai dikecualikan: itu agen KASIH cash ke customer, jadi Cash
   berkurang, bukan nambah. Kasbon (belum lunas) dilewati — cash-nya baru masuk
   pas dilunasi lewat lunasiKasbon() yang sudah punya jalur sendiri. */
function syncCashMirror(tx, cat){
  DB.transactions = DB.transactions.filter(t=>t.mirror_of!==tx.id); // rebuild dari nol, aman buat edit
  if(!cat.is_penjualan || tx.payment_status!=='paid') return;
  const cashAcc = DB.accounts.find(a=>a.tipe==='cash');
  if(!cashAcc || cashAcc.id===tx.account_id) return; // transaksi Cash sendiri gak perlu di-mirror ke dirinya
  const isTarik = /^tarik/i.test(cat.name);
  DB.transactions.push({
    id: uid('transactions'), tanggal: tx.tanggal,
    account_id: isTarik ? cashAcc.id : null,
    target_account_id: isTarik ? null : cashAcc.id,
    kategori_id: null, kategori: cat.name, jenis: 'Mutasi Cash: '+tx.jenis,
    flow: 'Mutasi', is_penjualan: false, amount: tx.amount, profit: 0,
    catatan: 'Otomatis dari transaksi #'+tx.id, expense_type: null,
    payment_status: 'paid', netral_arah: null,
    kasir_id: tx.kasir_id, locked: 0, flag_suspect: 0, suspect_reasons: '',
    created_at: nowIso(), mirror_of: tx.id
  });
}
function submitTransaksi(){
  if(!inputState.account_id) return toast('Pilih akun dulu','error');
  if(!inputState.category_id) return toast('Pilih kategori dulu','error');
  const amount = Number(kpValue);
  if(!amount || amount<=0) return toast('Nominal harus diisi','error');
  const acc = getAccount(inputState.account_id);
  const cat = getCategory(inputState.category_id);
  const jenis = document.getElementById('f-jenis').value.trim() || cat.name;
  const catatan = document.getElementById('f-catatan').value.trim();
  const profit = cat.is_penjualan ? Number(document.getElementById('f-profit').value||0) : 0;
  const paymentStatus = inputState.payment_status;
  let pelanggan = '';
  if(paymentStatus==='unpaid'){
    pelanggan = document.getElementById('f-pelanggan').value.trim();
    if(!pelanggan) return toast('Isi nama pelanggan untuk transaksi kasbon','error');
    if(cat.flow!=='Pemasukan') return toast('Kasbon hanya berlaku untuk transaksi Pemasukan','error');
  }

  // ---- Belanja Stok: bukan Pengeluaran biasa, tapi MUTASI nilai dari akun dana ke akun
  // Barang/Voucher Fisik — jadi nominal belanja ikut nambah nilai stok, gak cuma ilang.
  // (lihat fix gap "nominal belanja stok gak nambah ke akun Barang/Voucher") ----
  const isStockPurchase = cat.name==='Belanja Stok';
  let stockTargetAcc = null;
  if(isStockPurchase){
    stockTargetAcc = getAccount(inputState.target_stock_id);
    if(!stockTargetAcc) return toast('Pilih akun tujuan stok (Barang/Voucher Fisik) dulu','error');
  }
  const txFlow = isStockPurchase ? 'Mutasi' : cat.flow;
  const txTargetId = isStockPurchase ? stockTargetAcc.id : null;
  // Belanja Stok = mutasi aset (uang -> nilai stok), BUKAN expense P&L — ongkosnya udah otomatis
  // "terpakai" lewat margin/profit tiap kali barang dari stok itu terjual. Kalau expense_type
  // ikut ditempel di sini, Laba Rugi bakal motong modal DUA KALI (sekali di margin, sekali lagi
  // di sini). Makanya null, bukan 'COGS'.
  const txExpenseType = isStockPurchase ? null : ((cat.flow==='Pengeluaran' && !cat.is_penjualan) ? window._expenseType : null);

  // ---- mode EDIT: perbarui transaksi yang sudah ada, bukan buat baru ----
  if(editingTxId){
    const orig = DB.transactions.find(x=>x.id===editingTxId);
    if(!orig || orig.locked){
      toast('Transaksi sudah terkunci (Tutup Kasir), tidak bisa diedit lagi','error');
      editingTxId = null; return navigate('riwayat');
    }
    const linkedMirror = DB.transactions.find(m=>m.mirror_of===orig.id);
    if(linkedMirror && linkedMirror.locked){
      toast('Mutasi Cash terkait sudah terkunci (Tutup Kasir), tidak bisa diedit lagi','error');
      editingTxId = null; return navigate('riwayat');
    }
    if(isStockPurchase){
      const today = todayStr();
      const closingTgt = getLatestClosing(stockTargetAcc.id);
      if(closingTgt && today <= closingTgt.tanggal) return toast('Akun tujuan stok sudah terkunci (Tutup Kasir)','error');
    }
    Object.assign(orig, {
      account_id: acc.id, target_account_id: txTargetId, kategori_id: cat.id, kategori: cat.name, jenis, flow: txFlow, is_penjualan: !!cat.is_penjualan, amount, profit,
      catatan, expense_type: txExpenseType,
      payment_status: paymentStatus, netral_arah: cat.flow==='Netral' ? (cat.arah||'+') : null,
    });
    runAudit(orig);
    DB.kasbon = DB.kasbon.filter(k=>k.transaction_id!==orig.id);
    if(paymentStatus==='unpaid'){
      DB.kasbon.push({id:uid('kasbon'), transaction_id:orig.id, nama_pelanggan:pelanggan, account_id:acc.id,
        amount, tanggal:orig.tanggal, status:'unpaid', tanggal_lunas:null, catatan});
    }
    syncCashMirror(orig, cat);
    saveDB();
    const backId = orig.id; editingTxId = null;
    toast(orig.flag_suspect ? 'Diperbarui, tapi ditandai audit: '+orig.suspect_reasons : 'Transaksi diperbarui', orig.flag_suspect?'error':'ok');
    navigate('txDetail', {id: backId});
    return;
  }

  // ---- mode BARU ----
  // cek lock: akun sudah ditutup-kasir untuk tanggal hari ini?
  const closing = getLatestClosing(acc.id);
  const today = todayStr();
  if(closing && today <= closing.tanggal) return toast('Tanggal ini sudah terkunci (Tutup Kasir). Gunakan transaksi penyesuaian.','error');
  if(isStockPurchase){
    const closingTgt = getLatestClosing(stockTargetAcc.id);
    if(closingTgt && today <= closingTgt.tanggal) return toast('Akun tujuan stok sudah terkunci (Tutup Kasir)','error');
  }

  const tx = {
    id: uid('transactions'), tanggal: today, account_id: acc.id, target_account_id: txTargetId,
    kategori_id: cat.id, kategori: cat.name, jenis, flow: txFlow, is_penjualan: !!cat.is_penjualan, amount, profit,
    catatan, expense_type: txExpenseType,
    payment_status: paymentStatus, netral_arah: cat.flow==='Netral' ? (cat.arah||'+') : null,
    kasir_id: DB.currentKasirId, locked:0, flag_suspect:0, suspect_reasons:'', created_at: nowIso()
  };
  runAudit(tx);
  DB.transactions.push(tx);
  if(paymentStatus==='unpaid'){
    DB.kasbon.push({id:uid('kasbon'), transaction_id:tx.id, nama_pelanggan:pelanggan, account_id:acc.id,
      amount, tanggal:today, status:'unpaid', tanggal_lunas:null, catatan});
  }
  syncCashMirror(tx, cat);
  saveDB();
  toast(tx.flag_suspect ? 'Tersimpan, tapi ditandai audit: '+tx.suspect_reasons : 'Transaksi tersimpan', tx.flag_suspect?'error':'ok');
  navigate('dashboard');
}

window._kpOnChange = ()=>{ const el=document.getElementById('transfer-preview'); if(el) el.innerHTML = transferPreviewHtml(); };
function transferPreviewHtml(){
  if(!transferState.source || !transferState.target) return '<div class="hint">Pilih akun asal & tujuan.</div>';
  if(transferState.source === transferState.target) return '<div class="hint" style="color:var(--danger)">Akun asal & tujuan tidak boleh sama.</div>';
  const amt = Number(kpValue);
  const sAcc = getAccount(transferState.source), tAcc = getAccount(transferState.target);
  const sBefore = getSaldo(sAcc.id), tBefore = getSaldo(tAcc.id);
  return `
    <div class="lbl">PREVIEW SALDO</div>
    <div style="display:flex;justify-content:space-between;margin-top:6px;font-size:calc(12.5px * var(--fs-mult));">
      <span>${esc(sAcc.name)}: ${fmtRp(sBefore)} → <b style="color:var(--danger)">${fmtRp(sBefore-amt)}</b></span>
    </div>
    <div style="display:flex;justify-content:space-between;margin-top:4px;font-size:calc(12.5px * var(--fs-mult));">
      <span>${esc(tAcc.name)}: ${fmtRp(tBefore)} → <b style="color:var(--success)">${fmtRp(tBefore+amt)}</b></span>
    </div>
    ${amt > sBefore ? '<div class="hint" style="color:var(--danger)">Nominal melebihi saldo akun asal.</div>':''}
  `;
}

  const keep = kpValue;
  document.getElementById('screen').innerHTML = screenTransfer(false);

function submitTransfer(){
  const amount = Number(kpValue);
  if(!amount || amount<=0) return toast('Nominal harus diisi','error');
  if(transferState.source === transferState.target) return toast('Akun asal & tujuan tidak boleh sama','error');
  const sAcc = getAccount(transferState.source), tAcc = getAccount(transferState.target);
  const sBefore = getSaldo(sAcc.id);
  if(amount > sBefore) return toast('Saldo akun asal tidak mencukupi','error');
  const catatan = document.getElementById('tr-catatan').value.trim();
  const today = todayStr();
  const closing = getLatestClosing(sAcc.id);
  if(closing && today <= closing.tanggal) return toast('Akun asal sudah terkunci (Tutup Kasir)','error');
  const closingTgt = getLatestClosing(tAcc.id);
  if(closingTgt && today <= closingTgt.tanggal) return toast('Akun tujuan sudah terkunci (Tutup Kasir)','error');

  const tx = {id: uid('transactions'), tanggal: today, account_id: sAcc.id, target_account_id: tAcc.id,
    kategori_id:null, kategori:'Mutasi Saldo', jenis:'Pindah Saldo', flow:'Mutasi', is_penjualan:false, amount, profit:0,
    catatan, expense_type:null, payment_status:'paid', netral_arah:null,
    kasir_id: DB.currentKasirId, locked:0, flag_suspect:0, suspect_reasons:'', created_at: nowIso()};
  runAudit(tx);
  DB.transactions.push(tx);
  saveDB();
  toast('Saldo berhasil dipindahkan','ok');
  navigate('dashboard');
}

/* ---------------- RIWAYAT ---------------- */
let riwayatFilter = 'all';
let riwayatLimit = 30;
let riwayatSearch = '';
function riwayatFilteredList(){
  let list = DB.transactions.slice().sort((a,b)=> (b.tanggal+String(b.id).padStart(6,'0')).localeCompare(a.tanggal+String(a.id).padStart(6,'0')));
  if(riwayatFilter==='penjualan') list = list.filter(t=>t.flow==='Pemasukan'||t.flow==='Pengeluaran');
  else if(riwayatFilter!=='all') list = list.filter(t=>t.flow===riwayatFilter);
  const q = riwayatSearch.trim().toLowerCase();
  if(q) list = list.filter(t=>{
    const acc = getAccount(t.account_id), tgt = getAccount(t.target_account_id);
    return [t.jenis, t.kategori, t.catatan, acc?.name, tgt?.name].some(v=>v && String(v).toLowerCase().includes(q));
  });
  return list;
}
function screenRiwayat(){
  const tabs = [['all','Semua'],['penjualan','Penjualan'],['Mutasi','Mutasi'],['Netral','Netral']];
  return `
    <div class="card" style="padding:2px 14px;margin-bottom:8px;">
      <input type="text" id="riwayat-search" placeholder="🔍 Cari transaksi (jenis, akun, catatan)..." value="${esc(riwayatSearch)}"
        oninput="riwayatSearch=this.value; riwayatLimit=30; renderRiwayatBody();"
        style="width:100%;border:none;outline:none;background:transparent;color:var(--text);padding:12px 0;font-size:calc(14px * var(--fs-mult));">
    </div>
    <div class="tabs">
      ${tabs.map(([id,label])=>`<div class="tab ${riwayatFilter===id?'sel':''}" onclick="setRiwayatFilter('${id}')">${label}</div>`).join('')}
    </div>
    <div id="riwayat-body">${riwayatBodyHTML()}</div>
  `;
}
function riwayatBodyHTML(){
  const list = riwayatFilteredList();
  const shown = list.slice(0, riwayatLimit);
  return `
    <div class="card" style="padding:6px 14px;">
      ${shown.length? shown.map(t=>renderTxRow(t)).join('') : `<div class="empty-state"><div class="ic">📭</div>Tidak ada transaksi.</div>`}
    </div>
    ${list.length > shown.length ? `<button class="btn btn-outline" onclick="riwayatLimit+=30; renderRiwayatBody();">Muat Lebih Banyak</button>` : ''}

      ${t.locked? `<div class="hint" style="color:var(--danger);margin-top:6px;">🔒 Terkunci — sudah masuk periode Tutup Kasir, tidak bisa diubah/dihapus. Buat transaksi penyesuaian baru jika perlu koreksi.</div>`
        : `<div class="btn-row" style="margin-top:14px;gap:8px;">
             <button class="btn" style="background:var(--primary)" onclick="startEditTx(${t.id})">Edit Transaksi</button>
             <button class="btn btn-danger" onclick="deleteTx(${t.id})">Hapus Transaksi</button>
           </div>`}
    </div>
  `;
}
let editingTxId = null;
function startEditTx(id){
  const t = DB.transactions.find(x=>x.id===id);
  if(!t || t.locked) return toast('Transaksi terkunci, tidak bisa diedit','error');
  if(t.mirror_of) return toast('Ini mutasi Cash otomatis — edit transaksi penjualan aslinya, mutasi ini ikut menyesuaikan','error');
  editingTxId = id;
  kpValue = String(t.amount);
  inputState = {account_id: t.account_id, category_id: t.kategori_id, payment_status: t.payment_status};
  window._expenseType = t.expense_type || 'COGS';
  navigate('editTx');
}
function deleteTx(id){
  const t = DB.transactions.find(x=>x.id===id);
  if(!t || t.locked) return toast('Transaksi terkunci, tidak bisa dihapus','error');
  if(t.mirror_of) return toast('Ini mutasi Cash otomatis — hapus transaksi penjualan aslinya, mutasi ini ikut terhapus','error');
  const linkedMirror = DB.transactions.find(m=>m.mirror_of===id);
  if(linkedMirror && linkedMirror.locked) return toast('Mutasi Cash terkait sudah terkunci (Tutup Kasir), tidak bisa dihapus','error');
  if(!confirm('Hapus transaksi ini?')) return;
  DB.transactions = DB.transactions.filter(x=>x.id!==id && x.mirror_of!==id);
  DB.kasbon = DB.kasbon.filter(k=>k.transaction_id!==id);
  saveDB(); toast('Transaksi dihapus','ok'); navigate('riwayat');
}

function lunasiKasbon(id){
  const k = DB.kasbon.find(x=>x.id===id); if(!k) return;
  if(!confirm(`Tandai kasbon ${k.nama_pelanggan} sebesar ${fmtRp(k.amount)} sebagai lunas?`)) return;
  const cashAcc = DB.accounts.find(a=>a.tipe==='cash' && a.aktif) || DB.accounts[0];
  if(!cashAcc) return toast('Tidak ada akun kas aktif untuk menerima pelunasan','error');
  const closing = getLatestClosing(cashAcc.id);
  const today = todayStr();
  if(closing && today <= closing.tanggal) return toast('Akun kas ('+cashAcc.name+') sudah terkunci (Tutup Kasir), tidak bisa terima pelunasan hari ini','error');
  k.status='paid'; k.tanggal_lunas = today;
  const tx = {id:uid('transactions'), tanggal: today, account_id: cashAcc.id, target_account_id:null,
    kategori_id:null, kategori:'Pelunasan Kasbon', jenis:'Pelunasan kasbon: '+k.nama_pelanggan, flow:'Pemasukan', is_penjualan:false,
    amount:k.amount, profit:0, catatan:'Pelunasan kasbon #'+k.id, expense_type:null, payment_status:'paid',
    netral_arah:null, kasir_id:DB.currentKasirId, locked:0, flag_suspect:0, suspect_reasons:'', created_at:nowIso()};
  DB.transactions.push(tx);
  saveDB(); toast('Kasbon dilunasi','ok'); navigate('kasbon');
}

/* ---------------- TUTUP KASIR ---------------- */
function screenTutupKasirPilih(){

    <div class="card" style="cursor:pointer" onclick="navigate('tutupkasirseluruh')">

    </div>

let closingAccId = null;
let closingTanggal = null;
function screenTutupKasir(){
  closingAccId = closingAccId || activeAccounts()[0]?.id;
  if(!closingTanggal) closingTanggal = defaultClosingDate(closingAccId);
  const acc = getAccount(closingAccId);
  const lastClosing = getLatestClosing(closingAccId);
  const minDate = lastClosing ? addDays(lastClosing.tanggal, 1) : null;
  const today = todayStr();
  const saldoSistem = acc? getSaldoAsOf(acc.id, closingTanggal) : 0;
  const isBackfill = closingTanggal < today;
  const relatedKasbon = DB.kasbon.filter(k=>k.status==='unpaid' && k.account_id===closingAccId && k.tanggal===closingTanggal);
  return `
    <label class="f">Pilih Akun</label>
    <div class="seg">
      ${activeAccounts().filter(a=>a.tipe!=='cash').map(a=>`<button type="button" class="seg-btn ${a.id===closingAccId?'sel':''}"
        style="${a.id===closingAccId?`background:${ACC_COLOR[a.tipe]}`:''}"
        onclick="closingAccId=${a.id}; closingTanggal=null; document.getElementById('screen').innerHTML=screenTutupKasir();">${esc(a.name)}</button>`).join('')}
    </div>
    <label class="f">Tanggal Tutup Kasir</label>
    <input type="date" id="f-closing-tanggal" value="${closingTanggal}" max="${today}" ${minDate?`min="${minDate}"`:''}
      onchange="closingTanggal=this.value; document.getElementById('screen').innerHTML=screenTutupKasir();">
    ${isBackfill? `<div class="hint" style="color:var(--warning)">⚠ Ini penutupan susulan untuk tanggal lampau (lupa tutup kemarin). Saldo sistem di bawah dihitung sampai akhir <b>${closingTanggal}</b> saja — transaksi setelah tanggal ini (termasuk yang sudah Anda input hari ini) TIDAK ikut dihitung maupun ikut terkunci.</div>` : ''}
    <div class="card-sub">
      <div class="lbl">${acc && acc.tipe==='cash' ? 'SALDO CASH (PEMBANDING) PER AKHIR' : 'SALDO SISTEM PER AKHIR'} ${esc(closingTanggal)}</div>
      <div class="val">${fmtRp(saldoSistem)}</div>
    </div>
    ${acc && acc.tipe==='cash' ? cashOriginBreakdownHTML(acc.id, closingTanggal) : cashContributionFromAccountHTML(acc, closingTanggal)}
    ${relatedKasbon.length? `<div class="hint" style="color:var(--warning)">Ada ${relatedKasbon.length} kasbon belum lunas pada tanggal ini terkait akun ini — selisih terkait ini tidak otomatis dianggap kecurangan.</div>`:''}
    <label class="f">Saldo Fisik (hasil hitung nyata)</label>
    <input type="text" id="f-saldofisik" inputmode="numeric" placeholder="0" onfocus="scrollToMe(this)"
      oninput="this.value=this.value.replace(/[^0-9]/g,''); updateSelisihPreview(${saldoSistem})">
    <div id="selisih-preview" class="hint"></div>
    <label class="f">Catatan (opsional)</label>
    <textarea id="f-closing-catatan" onfocus="scrollToMe(this)"></textarea>
    <div style="height:10px"></div>
    <button class="btn btn-danger" onclick="submitClosing(${saldoSistem})">Tutup Kasir Akun Ini — ${esc(closingTanggal)}</button>
  `;
}
function cashContributionFromAccountHTML(acc, tanggal){
  if(!acc) return '';
  const cashAcc = DB.accounts.find(a=>a.tipe==='cash');
  if(!cashAcc || cashAcc.id===acc.id) return '';
  const closing = getClosingAsOf(cashAcc.id, tanggal);
  const afterDate = closing ? closing.tanggal : null;
  let total = 0;
  for(const t of DB.transactions){
    if(!t.mirror_of) continue;
    if(afterDate && t.tanggal<=afterDate) continue;
    if(t.tanggal>tanggal) continue;
    const orig = DB.transactions.find(x=>x.id===t.mirror_of);
    if(!orig || orig.account_id!==acc.id) continue;
    if(t.account_id===cashAcc.id) total -= t.amount;
    else if(t.target_account_id===cashAcc.id) total += t.amount;
  }
  if(!total) return '';
  return `
    <div class="card-sub">
      <div class="lbl">CASH PEMBANDING DARI ${esc(acc.name).toUpperCase()}</div>
      <div class="val" style="color:${total>=0?'var(--success)':'var(--danger)'}">${total>=0?'+':''}${fmtRp(total)}</div>
      <div class="hint">Bagian dari total Cash yang asalnya dari transaksi penjualan akun ini.</div>
    </div>`;
}
function cashOriginBreakdownHTML(cashAccountId, tanggal){
  const closing = getClosingAsOf(cashAccountId, tanggal);
  const afterDate = closing ? closing.tanggal : null;
  const map = {};
  for(const t of DB.transactions){
    if(!t.mirror_of) continue;
    if(afterDate && t.tanggal<=afterDate) continue;
    if(t.tanggal>tanggal) continue;
    if(t.account_id===cashAccountId) map[t.kategori] = (map[t.kategori]||0) - t.amount;
    else if(t.target_account_id===cashAccountId) map[t.kategori] = (map[t.kategori]||0) + t.amount;
  }
  const entries = Object.entries(map).sort((a,b)=>b[1]-a[1]);
  if(!entries.length) return '';
  return `
    <div class="section-title">Asal Usul Cash (dari Transaksi Penjualan)</div>
    <div class="card" style="padding:6px 14px;">
      ${entries.map(([kategori,total])=>`
        <div class="row-item"><div class="row-main"><div class="row-title">${esc(kategori)}</div></div>
        <div class="row-amt" style="color:${total>=0?'var(--success)':'var(--danger)'}">${total>=0?'+':''}${fmtRp(total)}</div></div>`).join('')}
    </div>`;
}
function updateSelisihPreview(saldoSistem){
  const fisik = Number(document.getElementById('f-saldofisik').value||0);
  const selisih = fisik - saldoSistem;
  const el = document.getElementById('selisih-preview');
  el.style.color = selisih===0 ? 'var(--success)' : 'var(--danger)';
  el.textContent = 'Selisih: ' + fmtRp(selisih) + (selisih===0? ' (sesuai)' : selisih>0 ? ' (lebih)' : ' (kurang)');
}
/* helper inti: push record closing + kunci transaksi akun itu s/d tanggal.
   Dipakai baik oleh submitClosing (satu akun) maupun submitClosingSeluruh (banyak akun),
   supaya logika locking & perhitungan selisih gak dobel-tulis. */
function closeOneAccount(accountId, tanggal, fisik, catatan){
  const saldoSistem = getSaldoAsOf(accountId, tanggal);
  const selisih = fisik - saldoSistem;
  DB.closings.push({id:uid('closings'), tanggal, account_id: accountId, saldo_sistem: saldoSistem,
    saldo_fisik: fisik, selisih, catatan, waktu_tutup: nowIso()});
  DB.transactions.forEach(t=>{
    if((t.account_id===accountId || t.target_account_id===accountId) && t.tanggal<=tanggal) t.locked=1;
  });
  return {selisih, saldoSistem};
}
function submitClosing(saldoSistem){
  const tanggal = closingTanggal;
  const lastClosing = getLatestClosing(closingAccId);
  if(lastClosing && tanggal<=lastClosing.tanggal) return toast('Tanggal ini sudah pernah ditutup kasir','error');
  if(tanggal>todayStr()) return toast('Tidak bisa menutup kasir untuk tanggal yang belum terjadi','error');
  const fisik = Number(document.getElementById('f-saldofisik').value||0);
  const catatan = document.getElementById('f-closing-catatan').value.trim();
  const selisih = fisik - saldoSistem;
  if(!confirm('Tutup kasir untuk akun ini pada tanggal '+tanggal+'? Semua transaksi tanggal itu & sebelumnya pada akun ini akan terkunci permanen.')) return;
  closeOneAccount(closingAccId, tanggal, fisik, catatan);
  saveDB();
  closingTanggal = null;
  toast(selisih===0? 'Kasir ditutup, saldo sesuai' : 'Kasir ditutup, ada selisih '+fmtRp(selisih), selisih===0?'ok':'error');
  navigate('dashboard');
}

/* ---------------- TUTUP KASIR SELURUH (semua akun sekaligus) ----------------
   Desain: user CUMA hitung fisik SEKALI secara total (gabungan semua akun),
   bukan per akun satu-satu. Per akun cuma ditampilkan info saldo sistemnya aja
   (read-only) buat referensi, lalu dibandingkan ke satu angka fisik gabungan.
   Closing record per akun tetap dibuat (locking & checkpoint saldo lanjutan
   butuh itu), dengan saldo_fisik = saldo_sistem masing-masing (gak ada cara
   pisahin selisih ke akun mana secara individual dari input gabungan) —
   selisih TOTAL yang beneran mau dicek user ditulis di catatan tiap record. */
let seluruhTanggal = null;
function screenTutupKasirSeluruh(){
  const accs = activeAccounts();
  const nonCashAccs = accs.filter(a=>a.tipe!=='cash');
  if(!seluruhTanggal){
    const candidates = nonCashAccs.map(a=>defaultClosingDate(a.id)).sort();
    seluruhTanggal = candidates[0] || todayStr();
  }
  const tanggal = seluruhTanggal;
  const today = todayStr();

  // Cash SENGAJA dikeluarkan dari eligible/total: dia cuma kartu pembanding di sini,
  // penutupannya sendiri lewat Tutup Kasir Sebagian — kalau ikut kehitung di sini,
  // TOTAL SALDO SISTEM jadi gak nyambung sama daftar akun non-cash yang ditampilkan
  // di atasnya, dan gak apple-to-apple sama TOTAL SALDO SAAT INI di dashboard.
  const eligible = nonCashAccs.filter(a=>{ const lc=getLatestClosing(a.id); return !(lc && tanggal<=lc.tanggal); });
  const totalSistem = eligible.reduce((s,a)=>s+getSaldoAsOf(a.id, tanggal), 0);

  const cashAcc = accs.find(a=>a.tipe==='cash');

  const rows = nonCashAccs.map(a=>{
    const lastClosing = getLatestClosing(a.id);
    const alreadyClosed = lastClosing && tanggal<=lastClosing.tanggal;
    if(alreadyClosed){
      return `<div class="row-item">
        <div class="row-main"><div class="row-title">${esc(a.name)}</div><div class="row-sub">${ACC_LABEL[a.tipe]} · sudah ditutup s/d ${esc(lastClosing.tanggal)}</div></div>
        <div class="row-amt" style="color:var(--muted)">✅ dilewati</div>
      </div>`;
    }
    const saldoSistem = getSaldoAsOf(a.id, tanggal);
    return `<div class="row-item">
      <div class="row-main"><div class="row-title">${esc(a.name)}</div><div class="row-sub">${ACC_LABEL[a.tipe]}</div></div>
      <div class="row-amt">${fmtRp(saldoSistem)}</div>
    </div>`;
  }).join('');

  // Cash sengaja dipisah dari daftar akun di atas: angkanya adalah data PEMBANDING
  // (hasil akumulasi mutasi dari penjualan akun-akun lain), bukan akun independen
  // yang sejajar dengan yang lain — makanya ditaruh sejajar dengan TOTAL SALDO SISTEM.
  let cashCardHTML = '';
  if(cashAcc){
    const lastClosingCash = getLatestClosing(cashAcc.id);
    const cashAlreadyClosed = lastClosingCash && tanggal<=lastClosingCash.tanggal;
    cashCardHTML = cashAlreadyClosed
      ? `<div class="card-sub" style="flex:1">
          <div class="lbl">SALDO CASH (PEMBANDING)</div>
          <div class="val" style="color:var(--muted)">✅ sudah ditutup s/d ${esc(lastClosingCash.tanggal)}</div>
        </div>`
      : `<div class="card-sub" style="flex:1">
          <div class="lbl">SALDO CASH (PEMBANDING)</div>
          <div class="val">${fmtRp(getSaldoAsOf(cashAcc.id, tanggal))}</div>
        </div>`;
  }

  const inDay = DB.transactions.filter(t=>t.tanggal===tanggal);
  let belanjaStokHari=0, opexHari=0, pendapatanHari=0;
  inDay.forEach(t=>{
    if(t.is_penjualan && t.payment_status==='paid') pendapatanHari += (t.profit||0);
    if(t.expense_type==='OPEX') opexHari += t.amount;
    if(t.flow==='Mutasi' && t.kategori==='Belanja Stok') belanjaStokHari += t.amount;
  });

  return `
    <label class="f" style="margin-top:0">Tanggal Tutup Kasir (semua akun)</label>
    <input type="date" id="f-seluruh-tanggal" value="${tanggal}" max="${today}"
      onchange="seluruhTanggal=this.value; document.getElementById('screen').innerHTML=screenTutupKasirSeluruh();">
    <div class="hint">Cuma akun yang belum ditutup sampai tanggal ini yang diproses. Akun yang sudah ditutup otomatis dilewati (ditandai ✅).</div>

    <div class="card-sub" style="margin-top:10px">
      <div class="lbl">BELANJA STOK &amp; BIAYA OPERASIONAL — ${esc(tanggal)}</div>
      <div class="hint" style="margin:4px 0 8px">
        <b>Belanja Stok</b>: uang yang keluar hari itu buat beli stok/barang dagangan — udah otomatis pindah jadi nilai stok di akun Barang/Voucher Fisik (kelihatan di saldo sistem akun itu di atas), bukan hilang.<br>
        <b>Biaya Operasional</b>: pengeluaran rutin usaha hari itu (listrik, sewa, dll).<br>
        Dua angka ini cuma referensi/konteks, bukan bagian dari saldo akun manapun.
      </div>
      <div style="display:flex;justify-content:space-between;padding:4px 0"><span>Belanja Stok</span><b style="color:var(--danger)">-${fmtRp(belanjaStokHari)}</b></div>
      <div style="display:flex;justify-content:space-between;padding:4px 0"><span>Biaya Operasional</span><b style="color:var(--danger)">-${fmtRp(opexHari)}</b></div>
      <div style="display:flex;justify-content:space-between;padding:4px 0"><span>Pendapatan (profit) hari ini</span><b style="color:var(--success)">${fmtRp(pendapatanHari)}</b></div>
    </div>

    <div class="section-title">Saldo Sistem per Akun</div>
    ${rows}

    <div style="display:flex;gap:8px;margin-top:10px">
      ${cashCardHTML}
      <div class="card-sub" style="flex:1">
        <div class="lbl">TOTAL SALDO SISTEM (${eligible.length} akun)</div>
        <div class="val">${fmtRp(totalSistem)}</div>
      </div>
    </div>

    <label class="f">Saldo Fisik Total (hasil hitung nyata gabungan seluruh akun)</label>
    <input type="text" id="f-fisik-total-seluruh" inputmode="numeric" placeholder="0" onfocus="scrollToMe(this)"
      oninput="this.value=this.value.replace(/[^0-9]/g,''); updateSelisihTotalSeluruh(${totalSistem})">
    <div id="selisih-total-seluruh" class="hint"></div>

    <label class="f">Catatan (opsional, berlaku untuk semua akun yang ditutup di sesi ini)</label>
    <textarea id="f-seluruh-catatan" onfocus="scrollToMe(this)"></textarea>
    <div style="height:10px"></div>
    ${eligible.length>0
      ? `<button class="btn btn-danger" onclick="submitClosingSeluruh('${tanggal}', ${totalSistem})">Tutup Kasir Seluruh Akun (${eligible.length}) — ${esc(tanggal)}</button>`
      : `<div class="hint" style="text-align:center">Semua akun sudah ditutup untuk tanggal ini.</div>`}
  `;
}
function updateSelisihTotalSeluruh(totalSistem){
  const fisik = Number(document.getElementById('f-fisik-total-seluruh').value||0);
  const selisih = fisik - totalSistem;
  const out = document.getElementById('selisih-total-seluruh');
  out.style.color = selisih===0 ? 'var(--success)' : 'var(--danger)';
  out.textContent = 'Selisih: ' + fmtRp(selisih) + (selisih===0? ' (sesuai)' : selisih>0 ? ' (lebih)' : ' (kurang)');
}
function submitClosingSeluruh(tanggal, totalSistem){
  const eligible = activeAccounts().filter(a=>a.tipe!=='cash').filter(a=>{ const lc=getLatestClosing(a.id); return !(lc && tanggal<=lc.tanggal); });
  if(!eligible.length) return toast('Tidak ada akun yang perlu ditutup','error');
  if(tanggal>todayStr()) return toast('Tidak bisa menutup kasir untuk tanggal yang belum terjadi','error');
  const catatanInput = document.getElementById('f-seluruh-catatan').value.trim();
  const fisikTotal = Number(document.getElementById('f-fisik-total-seluruh').value||0);
  const selisihTotal = fisikTotal - totalSistem;
  if(!confirm('Tutup kasir untuk '+eligible.length+' akun pada tanggal '+tanggal+'? Semua transaksi tanggal itu & sebelumnya pada akun-akun ini akan terkunci permanen.')) return;
  const ringkasan = `[Tutup Seluruh] Total sistem: ${fmtRp(totalSistem)} · Total fisik: ${fmtRp(fisikTotal)} · Selisih: ${fmtRp(selisihTotal)}`;
  const catatanGabungan = catatanInput ? ringkasan+'\n'+catatanInput : ringkasan;
  eligible.forEach(a=>{
    const saldoSistemAkun = getSaldoAsOf(a.id, tanggal);
    // fisik per akun disamakan dengan sistem (gak ada breakdown per akun dari input gabungan) —
    // selisih yang beneran relevan buat user ada di catatan & toast di bawah, level total.
    closeOneAccount(a.id, tanggal, saldoSistemAkun, catatanGabungan);
  });
  saveDB();
  seluruhTanggal = null;
  toast(selisihTotal===0 ? eligible.length+' akun ditutup, saldo total sesuai' : eligible.length+' akun ditutup, selisih total '+fmtRp(selisihTotal), selisihTotal===0?'ok':'error');
  navigate('dashboard');
}


/* ---------------- LAPORAN ---------------- */
function screenLaporan(){
  const today = todayStr();
  const monthPrefix = today.slice(0,7);
  const monthStart = monthPrefix+'-01';
  const dayBeforeMonth = addDays(monthStart, -1);
  const inMonth = DB.transactions.filter(t=>t.tanggal.startsWith(monthPrefix));

  // Omset = OMSET (total nilai transaksi), BUKAN profit. Kategori yang
  // is_penjualan=true di Kelola Kategori itu yang nentuin masuk omset atau nggak.
  // Field `profit` per transaksi itu catatan margin independen milikmu sendiri —
  // ditampilkan di bawah sebagai referensi, TAPI gak dipakai buat hitung Laba Rugi.
  let totalPenjualan=0, profitTercatat=0, opex=0;
  inMonth.forEach(t=>{
    if(t.is_penjualan && t.payment_status==='paid'){ totalPenjualan += t.amount; profitTercatat += (t.profit||0); }
    if(t.expense_type==='OPEX') opex += t.amount;
  });

  // HPP = Persediaan Awal + Pembelian − Persediaan Akhir (rumus akuntansi standar).
  // Persediaan = total saldo akun bertipe Barang/Voucher Fisik (nilai stok, nambah pas
  // Belanja Stok, berkurang pas kejual). Pembelian = Belanja Stok (Mutasi) bulan ini.
  const stockAccs = stockAccounts();
  const persediaanAwal = stockAccs.reduce((s,a)=>s+getSaldoAsOf(a.id, dayBeforeMonth), 0);
  const persediaanAkhir = stockAccs.reduce((s,a)=>s+getSaldoAsOf(a.id, today), 0);
  const pembelian = inMonth.filter(t=>t.flow==='Mutasi' && t.kategori==='Belanja Stok').reduce((s,t)=>s+t.amount, 0)
    + inMonth.filter(t=>t.expense_type==='COGS').reduce((s,t)=>s+t.amount, 0); // sisa yang ditag manual, bukan lewat Belanja Stok
  const hpp = persediaanAwal + pembelian - persediaanAkhir;

  const labaKotor = totalPenjualan - hpp;
  const labaBersih = labaKotor - opex;

  const penjualanPerKategori = {};
  inMonth.filter(t=>t.is_penjualan && t.payment_status==='paid').forEach(t=>{
    penjualanPerKategori[t.kategori] = (penjualanPerKategori[t.kategori]||0) + t.amount;
  });
  const maxPenjualan = Math.max(1, ...Object.values(penjualanPerKategori), 0);

  const opexPerJenis = {};
  inMonth.filter(t=>t.expense_type==='OPEX').forEach(t=>{
    const label = t.jenis || t.kategori;
    opexPerJenis[label] = (opexPerJenis[label]||0) + t.amount;
  });
  const maxOpex = Math.max(1, ...Object.values(opexPerJenis), 0);

  const barRow = (label, amt, max, color) => `
    <div style="margin-bottom:10px;">
      <div style="display:flex;justify-content:space-between;font-size:calc(12.5px * var(--fs-mult));font-weight:700;">
        <span>${esc(label)}</span><span>${fmtRp(amt)}</span>
      </div>
      <div style="background:#e2e8f0;border-radius:8px;height:8px;margin-top:4px;">
        <div style="background:${color};height:8px;border-radius:8px;width:${(amt/max*100).toFixed(0)}%"></div>
      </div>
    </div>`;

  return `
    <div class="section-title">Laba Rugi — ${monthPrefix}</div>
    <div class="card">
      <div class="row-item"><div class="row-main"><div class="row-title">Omset</div></div><div class="row-amt" style="color:var(--success)">${fmtRp(totalPenjualan)}</div></div>
      <div class="row-item"><div class="row-main"><div class="row-title">Beban Operasional</div></div><div class="row-amt" style="color:var(--danger)">-${fmtRp(opex)}</div></div>
      <div class="row-item"><div class="row-main"><div class="row-title" style="font-size:calc(15px * var(--fs-mult))">Laba Bersih</div></div><div class="row-amt" style="font-size:calc(16px * var(--fs-mult));color:${labaBersih>=0?'var(--success)':'var(--danger)'}">${fmtRp(labaBersih)}</div></div>
    </div>
    <div class="card-sub">
      <div class="lbl" style="font.bold" >PROFIT TERCATAT</div>
      <div class="val" style="color:var(--success)">${fmtRp(profitTercatat)}</div>
    </div>

    <div class="section-title">Penjualan per Kategori</div>
    <div class="card">
      ${Object.keys(penjualanPerKategori).length
        ? Object.entries(penjualanPerKategori).sort((a,b)=>b[1]-a[1]).map(([k,v])=>barRow(k,v,maxPenjualan,'var(--success)')).join('')
        : '<div class="empty-state">Belum ada penjualan bulan ini.</div>'}
    </div>

    <div class="section-title">Rincian Beban Operasional</div>
    <div class="card">
      ${Object.keys(opexPerJenis).length
        ? Object.entries(opexPerJenis).sort((a,b)=>b[1]-a[1]).map(([k,v])=>barRow(k,v,maxOpex,'var(--danger)')).join('')
        : '<div class="empty-state">Belum ada biaya operasional bulan ini.</div>'}
    </div>
  `;
}

/* ---------------- IMPORT / EXPORT CSV ---------------- */
function screenImportExport(){
  return `
    <div class="section-title">Export</div>
    <div class="card">
      <button class="btn" onclick="exportTransaksiCsv()">Export Transaksi (CSV)</button>
      <div style="height:8px"></div>
      <button class="btn btn-outline" onclick="exportAkunCsv()">Export Akun (CSV)</button>
      <div style="height:8px"></div>
      <button class="btn btn-outline" onclick="backupJson()">Backup Semua Data (JSON)</button>
    </div>
    <div class="section-title">Restore dari Backup JSON</div>
    <div class="card">
      <div class="hint" style="color:var(--danger)">⚠ Restore akan MENIMPA seluruh data yang ada sekarang (transaksi, akun, kategori, closing) dengan isi file backup. Pastikan file-nya benar sebelum lanjut.</div>
      <div style="height:10px"></div>
      <input type="file" id="restore-file" accept="application/json,.json">
      <div style="height:8px"></div>
      <button class="btn btn-danger" onclick="restoreJson()">Restore dari File Backup</button>
    </div>
    <div class="section-title">Import Transaksi dari CSV</div>
    <div class="card">
      <div class="hint">Kolom wajib: tanggal(YYYY-MM-DD), akun, kategori, jenis, nominal, profit, catatan, status_bayar(lunas/kasbon), nama_pelanggan</div>
      <div style="height:6px"></div>
      <button class="btn btn-outline" onclick="downloadTemplateCsv()">Unduh Template CSV</button>
      <div style="height:10px"></div>
      <input type="file" id="csv-file" accept=".csv,text/csv">
      <div style="height:8px"></div>
      <button class="btn" onclick="importCsv()">Import File CSV</button>
      <div id="import-result" class="hint"></div>
    </div>
  `;
}
function csvEscape(v){ v=String(v==null?'':v); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }
function downloadFile(filename, content, mime){
  const blob = new Blob([content], {type:mime||'text/csv;charset=utf-8;'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(a.href), 3000);
}
function exportTransaksiCsv(){
  const header = ['tanggal','akun','akun_tujuan','kategori','jenis','flow','nominal','profit','catatan','status_bayar','expense_type'];
  const rows = DB.transactions.map(t=>[t.tanggal, getAccount(t.account_id)?.name||'', t.target_account_id?getAccount(t.target_account_id)?.name||'':'',
    t.kategori||'', t.jenis, t.flow, t.amount, t.profit, t.catatan||'', t.payment_status, t.expense_type||'']);
  const csv = [header, ...rows].map(r=>r.map(csvEscape).join(',')).join('\n');
  downloadFile('transaksi_export_'+todayStr()+'.csv', csv);
  toast('Export transaksi berhasil','ok');
}
function exportAkunCsv(){
  const header = ['nama','tipe','saldo_awal','ambang_minimum','saldo_sekarang','aktif'];
  const rows = DB.accounts.map(a=>[a.name, a.tipe, a.saldo_awal, a.ambang_minimum, getSaldo(a.id), a.aktif?'ya':'tidak']);
  const csv = [header, ...rows].map(r=>r.map(csvEscape).join(',')).join('\n');
  downloadFile('akun_export_'+todayStr()+'.csv', csv);
  toast('Export akun berhasil','ok');
}
function backupJson(){
  downloadFile('backup_kasir_'+todayStr()+'.json', JSON.stringify(DB, null, 2), 'application/json');
  toast('Backup JSON diunduh','ok');
}
function restoreJson(){
  const inp = document.getElementById('restore-file');
  const file = inp && inp.files[0];
  if(!file) return toast('Pilih file backup JSON dulu','error');
  if(!confirm('Restore akan MENIMPA semua data yang ada sekarang dengan isi file backup ini dan tidak bisa dibatalkan. Yakin lanjut?')) return;
  const reader = new FileReader();
  reader.onload = () => {
    let parsed;
    try{ parsed = JSON.parse(reader.result); }
    catch(e){ return toast('File bukan JSON valid','error'); }
    if(!parsed || !Array.isArray(parsed.accounts) || !Array.isArray(parsed.categories) ||
       !Array.isArray(parsed.transactions) || !parsed.nextId){
      return toast('File ini bukan backup Kasir Front House yang valid','error');
    }
    DB = parsed;
    normalizeDB();
    saveDB();
    toast('Restore berhasil, memuat ulang...','ok');
    setTimeout(()=>location.reload(), 600);
  };
  reader.onerror = () => toast('Gagal membaca file','error');
  reader.readAsText(file);
}
function downloadTemplateCsv(){
  const header = ['tanggal','akun','kategori','jenis','nominal','profit','catatan','status_bayar','nama_pelanggan'];
  const contoh = ['2026-07-20','Kas Laci','Penjualan Barang','Contoh penjualan','50000','10000','','lunas',''];
  downloadFile('template_import_transaksi.csv', [header,contoh].map(r=>r.map(csvEscape).join(',')).join('\n'));
}
function parseCsvLine(line){
  // ponytail: parser CSV sederhana yang tetap menangani tanda kutip dasar, cukup untuk template ini
  const out=[]; let cur=''; let inQ=false;
  for(let i=0;i<line.length;i++){
    const ch=line[i];
    if(inQ){
      if(ch==='"' && line[i+1]==='"'){ cur+='"'; i++; }
      else if(ch==='"'){ inQ=false; }
      else cur+=ch;
    } else {
      if(ch==='"') inQ=true;
      else if(ch===','){ out.push(cur); cur=''; }
      else cur+=ch;
    }
  }
  out.push(cur);
  return out;
}
function importCsv(){
  const fileInput = document.getElementById('csv-file');
  const file = fileInput.files[0];
  if(!file) return toast('Pilih file CSV dulu','error');
  const reader = new FileReader();
  reader.onload = (e)=>{
    const lines = String(e.target.result).split(/\r?\n/).filter(l=>l.trim().length);
    if(lines.length<2) return toast('File CSV kosong','error');
    const header = parseCsvLine(lines[0]).map(h=>h.trim().toLowerCase());
    let ok=0, fail=0; const errors=[];
    for(let i=1;i<lines.length;i++){
      const cols = parseCsvLine(lines[i]);
      const row = {}; header.forEach((h,idx)=>row[h]=(cols[idx]||'').trim());
      try{
        const acc = DB.accounts.find(a=>a.name.toLowerCase()===String(row.akun||'').toLowerCase());
        if(!acc) throw new Error('akun "'+row.akun+'" tidak ditemukan');
        let cat = DB.categories.find(c=>c.name.toLowerCase()===String(row.kategori||'').toLowerCase());
        if(!cat) throw new Error('kategori "'+row.kategori+'" tidak ditemukan');
        const amount = Number(row.nominal); if(!amount || amount<=0) throw new Error('nominal tidak valid');
        const isUnpaid = String(row.status_bayar||'').toLowerCase().startsWith('kasbon');
        if(isUnpaid && !row.nama_pelanggan) throw new Error('nama_pelanggan wajib untuk kasbon');
        const tanggal = row.tanggal || todayStr();
        const tx = {id:uid('transactions'), tanggal, account_id:acc.id, target_account_id:null,
          kategori_id:cat.id, kategori:cat.name, jenis: row.jenis||cat.name, flow:cat.flow, is_penjualan: !!cat.is_penjualan,
          amount, profit: Number(row.profit||0), catatan: row.catatan||'',
          expense_type: (cat.flow==='Pengeluaran' && !cat.is_penjualan) ? 'OPEX' : null,
          payment_status: isUnpaid?'unpaid':'paid', netral_arah: cat.flow==='Netral'?(cat.arah||'+'):null,
          kasir_id: DB.currentKasirId, locked:0, flag_suspect:0, suspect_reasons:'', created_at:nowIso()};
        runAudit(tx);
        DB.transactions.push(tx);
        if(isUnpaid) DB.kasbon.push({id:uid('kasbon'), transaction_id:tx.id, nama_pelanggan:row.nama_pelanggan,
          account_id:acc.id, amount, tanggal, status:'unpaid', tanggal_lunas:null, catatan:row.catatan||''});
        ok++;
      }catch(err){ fail++; errors.push('Baris '+(i+1)+': '+err.message); }
    }
    saveDB();
    document.getElementById('import-result').innerHTML = `${ok} baris berhasil, ${fail} gagal.` +
      (errors.length? '<br>'+errors.slice(0,8).map(esc).join('<br>') : '');
    toast(`Import selesai: ${ok} berhasil, ${fail} gagal`, fail?'error':'ok');
  };
  reader.readAsText(file);
}

/* ============================ LOCK SCREEN ============================ */
let lockSelectedKasir = null;
let lockPin = '';
function renderLock(){
  const lock = document.getElementById('lockscreen');
  lock.style.display = 'flex';
  if(DB.kasir.length===0){ lock.innerHTML = renderLockSetup(); return; }
  if(!lockSelectedKasir){ lock.innerHTML = renderLockSelect(); return; }
  const k = getKasir(lockSelectedKasir);
  if(!k){ lockSelectedKasir=null; lock.innerHTML = renderLockSelect(); return; }
  if(!k.pin_hash){ DB.currentKasirId = k.id; saveDB(); lockSelectedKasir=null; render(); return; }
  lock.innerHTML = renderLockPin(k);
}
function renderLockSetup(){
  return `
    <div class="lock-inner">
      <div class="lock-logo">🧾</div>
      <div class="lock-title">Kasir Front House</div>
      <div class="lock-sub">Buat kasir pertama untuk mulai</div>
      <div style="width:100%;max-width:280px;">
        <input type="text" id="setup-nama" placeholder="Nama kasir" style="margin-bottom:10px;" onfocus="scrollToMe(this)">
        <input type="text" id="setup-pin" inputmode="numeric" maxlength="6" placeholder="PIN (opsional)" onfocus="scrollToMe(this)"
          oninput="this.value=this.value.replace(/[^0-9]/g,'')">
        <div style="height:12px"></div>
        <button class="btn" onclick="setupFirstKasir()">Mulai</button>
      </div>
    </div>`;
}
async function setupFirstKasir(){
  const nama = document.getElementById('setup-nama').value.trim() || 'Admin';
  const pin = document.getElementById('setup-pin').value.trim();
  let pin_hash=null, pin_salt=null;
  if(pin && pin.length>=4){ pin_salt=randomSalt(); pin_hash = await sha256(pin+pin_salt); }
  const id = uid('kasir');
  DB.kasir.push({id, nama, pin_hash, pin_salt, aktif:1});
  DB.currentKasirId = id; saveDB(); render();
}
function renderLockSelect(){
  const kasirs = DB.kasir.filter(k=>k.aktif);
  return `
    <div class="lock-inner">
      <div class="lock-logo">🧾</div>
      <div class="lock-title">Kasir Front House</div>
      <div class="lock-sub">Pilih kasir untuk masuk</div>
      <div class="kasir-tiles">
        ${kasirs.map(k=>`<button class="kasir-tile" onclick="lockSelectedKasir=${k.id}; renderLock();">
          <div class="kasir-avatar">${esc(k.nama.slice(0,1).toUpperCase())}</div>
          <div style="font-size:calc(11.5px * var(--fs-mult));font-weight:700;">${esc(k.nama)}</div>
        </button>`).join('')}
      </div>
    </div>`;
}
function renderLockPin(k){
  const dots = Array.from({length:6}).map((_,i)=>`<div class="pin-dot ${i<lockPin.length?'filled':''}"></div>`).join('');
  return `
    <div class="lock-inner">
      <div class="lock-logo">🔒</div>
      <div class="lock-title">${esc(k.nama)}</div>
      <div class="lock-sub">Masukkan PIN</div>
      <div class="pin-dots">${dots}</div>
      <div class="pin-keypad">
        ${['1','2','3','4','5','6','7','8','9'].map(n=>`<button class="pin-key" onclick="pinPress('${n}')">${n}</button>`).join('')}
        <span></span>
        <button class="pin-key" onclick="pinPress('0')">0</button>
        <button class="pin-key" onclick="pinPress('back')">⌫</button>
      </div>
      <button class="linklike" onclick="lockSelectedKasir=null; lockPin=''; renderLock();">← Ganti Kasir</button>
    </div>`;
}
async function pinPress(k){
  if(k==='back'){ lockPin = lockPin.slice(0,-1); renderLock(); return; }
  if(lockPin.length>=6) return;
  lockPin += k;
  const kasir = getKasir(lockSelectedKasir);
  if(lockPin.length >= 4){
    const hash = await sha256(lockPin + kasir.pin_salt);
    if(hash === kasir.pin_hash){ DB.currentKasirId = kasir.id; lockSelectedKasir=null; lockPin=''; saveDB(); render(); return; }
    if(lockPin.length===6 || lockPin.length===kasir.pin_hash.length || true){
      // beri kesempatan lanjut mengetik sampai batas wajar, cek ulang tiap ketukan
    }
  }
  renderLock();
  if(lockPin.length>=6){
    setTimeout(()=>{ toast('PIN salah','error'); lockPin=''; renderLock(); }, 200);
  }
}
